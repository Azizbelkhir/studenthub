
name: Build and deploy StudentHub Cloud to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  build:
    name: Build StudentHub Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Backend and Frontend
        run: npm run build

      - name: Verify build outputs
        run: |
          test -f backend/dist/server.js
          test -f frontend/dist/index.html

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: studenthub-app
          path: .
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: studenthub-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DFF315FCA64141A9AF6EED3C6DD25534 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1F17AE58B78C4FAAA89CEFBB0E9571B9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_11EA7A4062984118B2084FB7B4E51E05 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: studenthub-cloud-epi
          slot-name: Production
          package: .
          startup-command: node backend/dist/server.js

